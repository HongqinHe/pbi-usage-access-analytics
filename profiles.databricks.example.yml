# Example profile for running the same project on Databricks (dbt-databricks).
# Copy to ~/.dbt/profiles.yml and fill in your workspace values.
# Never commit real tokens -- use environment variables.
pbi_usage_access_analytics:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: analytics_dev
      schema: pbi_usage
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 8
    prod:
      type: databricks
      catalog: analytics_prod
      schema: pbi_usage
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 8

# On Databricks the sources would point at the raw Delta tables written by
# the Python ingestion job instead of the CSV files used locally.
